<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="420" viewBox="0 0 1080 420" font-family="Archivo, system-ui, sans-serif">
  <!-- og at a glance: your repo on the Mac, og between it and the sandbox, 1Password
       above, the file exchange below the sandbox. Same palette as proxy.svg. -->
  <defs>
    <marker id="h" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#9C9C98" stroke-width="1.5"/>
    </marker>
    <marker id="t" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto">
      <path d="M8,0 L0,4.5 L8,9" fill="none" stroke="#9C9C98" stroke-width="1.5"/>
    </marker>
  </defs>
  <style>
    .box { fill: #FFFFFF; stroke: #E6E6E3; stroke-width: 1.5; }
    .label { fill: #4D4D4D; font-size: 21px; font-weight: 600; }
    .sub { fill: #6B6B6B; font-size: 16px; }
    .lane { fill: #6B6B6B; font-size: 14px; }
    .wire { stroke: #9C9C98; stroke-width: 1.5; fill: none; }
    .head { marker-end: url(#h); }
    .tail { marker-start: url(#t); }
    .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
    .vault { fill: #F5F5F4; stroke: #E6E6E3; } .vault-t { fill: #616161; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #212120; stroke: #3A3A38; } .label { fill: #E8E8E6; } .sub, .lane { fill: #A8A8A4; }
      .wire { stroke: #8A8A86; } .vault { fill: #2A2A28; stroke: #3A3A38; } .vault-t { fill: #E8E8E6; }
    }
  </style>

  <!-- 1Password feeds og -->
  <rect class="vault" x="360" y="4" width="360" height="56" rx="9" stroke-width="1.5"/>
  <text class="vault-t" x="540" y="28" text-anchor="middle" font-size="18" font-weight="600">1Password</text>
  <text class="sub" x="540" y="48" text-anchor="middle" font-size="14">GitHub tokens, one per owner</text>
  <line class="wire head" x1="540" y1="60" x2="540" y2="94"/>

  <!-- your repo -->
  <rect class="box" x="10" y="96" width="270" height="244" rx="9"/>
  <text class="label" x="145" y="180" text-anchor="middle">your repo</text>
  <text class="sub mono" x="145" y="214" text-anchor="middle" font-size="15">~/Projects/acme/shop</text>
  <text class="sub" x="145" y="246" text-anchor="middle">your checkout stays yours:</text>
  <text class="sub" x="145" y="270" text-anchor="middle">the agent never touches it</text>
  <text class="lane" x="350" y="208" text-anchor="middle">you run og</text>
  <line class="wire head" x1="280" y1="218" x2="418" y2="218"/>

  <!-- og -->
  <rect x="420" y="96" width="240" height="244" rx="9" fill="#0F7A6E"/>
  <rect x="487" y="110" width="106" height="26" rx="13" fill="#FFFFFF"/>
  <text x="540" y="128" text-anchor="middle" fill="#0F7A6E" font-size="14" font-weight="600">on the Mac</text>
  <text x="540" y="200" text-anchor="middle" fill="#FFFFFF" font-size="26" font-weight="600" font-family="IBM Plex Mono, ui-monospace, monospace">og</text>
  <text x="540" y="234" text-anchor="middle" fill="#EAF5F3" font-size="16">creates the sandbox,</text>
  <text x="540" y="258" text-anchor="middle" fill="#EAF5F3" font-size="16">wires it up</text>
  <text x="540" y="282" text-anchor="middle" fill="#EAF5F3" font-size="16">and attaches you</text>

  <!-- og to the sandbox: two lanes -->
  <text class="lane" x="740" y="150" text-anchor="middle" font-size="13">create · attach · rm</text>
  <line class="wire head" x1="660" y1="160" x2="818" y2="160"/>
  <text class="lane" x="740" y="268" text-anchor="middle" font-size="13">token · rules · mounts</text>
  <line class="wire head" x1="660" y1="278" x2="818" y2="278"/>

  <!-- the sandbox -->
  <rect class="box" x="820" y="96" width="250" height="220" rx="9"/>
  <text class="label" x="945" y="140" text-anchor="middle">shop sandbox</text>
  <text class="sub" x="945" font-size="15" y="180" text-anchor="middle">Claude Code, in its own VM</text>
  <text class="sub" x="945" font-size="15" y="208" text-anchor="middle">its own clone of the repo</text>
  <text class="sub" x="945" font-size="15" y="236" text-anchor="middle">a token for acme's repos only</text>
  <text class="sub" x="945" font-size="15" y="264" text-anchor="middle">pushes to its own repo only</text>
  <text class="sub" x="945" font-size="15" y="292" text-anchor="middle">network closed by default</text>

  <!-- the file exchange, below -->
  <line class="wire head tail" x1="945" y1="320" x2="945" y2="352"/>
  <rect class="box" x="820" y="356" width="250" height="60" rx="9"/>
  <text class="label" x="945" y="381" text-anchor="middle" font-size="17">file exchange</text>
  <text class="sub" x="945" y="404" text-anchor="middle" font-size="14">og give · og take, screened</text>
</svg>
