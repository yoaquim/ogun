<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="350" viewBox="0 0 1080 350" font-family="Archivo, system-ui, sans-serif">
  <defs>
    <marker id="c" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#9C9C98" stroke-width="1.5"/>
    </marker>
  </defs>
  <style>
    .box { fill: #FFFFFF; stroke: #E6E6E3; stroke-width: 1.5; }
    .label { fill: #4D4D4D; font-size: 21px; font-weight: 600; }
    .sub { fill: #6B6B6B; font-size: 16px; }
    .lane { fill: #6B6B6B; font-size: 14px; }
    .wire { stroke: #9C9C98; stroke-width: 1.5; fill: none; }
    .head { marker-end: url(#c); }
    .through { stroke: #FFFFFF; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; opacity: 0.85; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
    .vault { fill: #F5F5F4; stroke: #E6E6E3; } .vault-t { fill: #616161; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #212120; stroke: #3A3A38; } .label { fill: #E8E8E6; } .sub, .lane { fill: #A8A8A4; }
      .wire { stroke: #8A8A86; } .vault { fill: #2A2A28; stroke: #3A3A38; } .vault-t { fill: #E8E8E6; }
    }
  </style>

  <!-- 1Password feeds the proxy -->
  <rect class="vault" x="360" y="4" width="360" height="56" rx="9" stroke-width="1.5"/>
  <text class="vault-t" x="540" y="27" text-anchor="middle" font-size="18" font-weight="600">1Password</text>
  <text class="sub" x="540" y="48" text-anchor="middle" font-size="14">the real token, handed over by og pass</text>
  <line class="wire head" x1="540" y1="60" x2="540" y2="94"/>

  <!-- sandbox -->
  <rect class="box" x="10" y="96" width="270" height="244" rx="9"/>
  <text class="label" x="145" y="190" text-anchor="middle">shop sandbox</text>
  <text class="sub mono" x="145" y="226" text-anchor="middle" font-size="15">API_TOKEN=placeholder</text>
  <text class="sub" x="145" y="256" text-anchor="middle">a fake value, not the token</text>
  <text class="sub" x="145" y="280" text-anchor="middle">the real one is never inside</text>

  <!-- proxy -->
  <rect x="420" y="96" width="240" height="244" rx="9" fill="#0F7A6E"/>
  <rect x="487" y="110" width="106" height="26" rx="13" fill="#FFFFFF"/>
  <text x="540" y="128" text-anchor="middle" fill="#0F7A6E" font-size="14" font-weight="600">on the Mac</text>
  <text x="540" y="204" text-anchor="middle" fill="#FFFFFF" font-size="21" font-weight="600"><tspan font-family="IBM Plex Mono, ui-monospace, monospace">sbx</tspan> proxy</text>
  <text x="540" y="232" text-anchor="middle" fill="#EAF5F3" font-size="16">swaps the placeholder for</text>
  <text x="540" y="256" text-anchor="middle" fill="#EAF5F3" font-size="16">the real token, only on</text>
  <text x="540" y="280" text-anchor="middle" fill="#EAF5F3" font-size="16">requests to its API</text>

  <!-- lane 1: to its API — swapped -->
  <text class="lane" x="350" y="150" text-anchor="middle">to its API</text>
  <line class="wire" x1="280" y1="160" x2="420" y2="160"/>
  <line class="through" x1="420" y1="160" x2="660" y2="160"/>
  <text x="540" y="154" text-anchor="middle" fill="#FFFFFF" font-size="12" opacity="0.9">swapped</text>
  <line class="wire head" x1="660" y1="160" x2="798" y2="160"/>
  <rect class="box" x="800" y="115" width="270" height="90" rx="9"/>
  <text class="label mono" x="935" y="153" text-anchor="middle" font-size="17">api.example.com</text>
  <text class="sub" x="935" y="181" text-anchor="middle">gets the real token</text>

  <!-- lane 2: anywhere else — untouched -->
  <text class="lane" x="350" y="300" text-anchor="middle">to anywhere else</text>
  <line class="wire" x1="280" y1="310" x2="420" y2="310"/>
  <line class="through" x1="420" y1="310" x2="660" y2="310"/>
  <text x="540" y="328" text-anchor="middle" fill="#FFFFFF" font-size="12" opacity="0.9">left as is</text>
  <line class="wire head" x1="660" y1="310" x2="798" y2="310"/>
  <rect class="box" x="800" y="265" width="270" height="80" rx="9"/>
  <text class="label" x="935" y="300" text-anchor="middle">any other host</text>
  <text class="sub" x="935" y="326" text-anchor="middle">gets only the fake value</text>
</svg>
