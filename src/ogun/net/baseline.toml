# og's own network baseline, the one every sandbox gets: src/ogun/net/baseline.py
# applies it, og doctor checks the live rules against it, and og internal baseline
# prints it. A [baseline] table in config.toml, all three keys, replaces it whole.

[baseline]

# Baseline egress for a development sandbox. `sbx env create` gives a sandbox NO
# network policy (deny-all); interactive creation offered "Balanced". Rules are
# global and persistent, so this is idempotent — `ogun policy` re-applies it.
# Only hosts nobody hostile can write to: download-only mirrors, and GitHub, where
# the proxy replaces any token the agent sends with the sandbox's own. github.com
# itself is in the HTTP rules below, read-only: a sandbox pushes only to its own
# repos (src/ogun/net/baseline.py). AWS is left
# out (docs/network.md#what-the-baseline-leaves-out): a pre-signed link to a
# stranger's S3 bucket works through it, so a sandbox gets AWS hosts only when you
# approve them for it. npm and Docker Hub come read-only, below.
domains = [
  "deb.debian.org",
  "security.debian.org",
  "api.github.com",
  "raw.githubusercontent.com",
  "objects.githubusercontent.com",
  "codeload.github.com",
]

# Hosts every sandbox may READ but never write to, as sbx HTTP rules ("<host>=<methods>",
# or "<host>=<methods>=<path glob>"): with only HTTP allows on a host,
# anything else is refused. github.com: reads, plus the POST a clone or fetch sends
# (git-upload-pack); a push is a POST to git-receive-pack, allowed per sandbox. npm and
# pip installs are GETs; a publish is a PUT or a POST, so a stranger's token can't publish
# your code. npm's audit is a POST, so it's refused too: `npm install --no-audit`, or
# approve it per sandbox. (PyPI's uploads go to upload.pypi.org, which isn't allowed at all.)
# download.docker.com and cli.github.com are the Docker and GitHub CLI apt repositories the
# sandbox image lists: apt reads them with GETs, and without them `apt-get update` fails and
# no tool installs (a template build stops there). Docker Hub, for the Docker every sandbox
# runs (docs/sandboxes.md#docker-inside-a-sandbox): a pull is GETs to the registry, its
# token service and the layer CDN (CloudFront or Cloudflare, by region); a push is a PUT,
# POST or PATCH to the registry, so a stranger's token can't push an image. docs.docker.com:
# Docker's own documentation, which an agent reads to use Docker and sbx; nothing to send there.
http = [
  "registry.npmjs.org=GET,HEAD",
  "pypi.org=GET,HEAD",
  "files.pythonhosted.org=GET,HEAD",
  "download.docker.com=GET,HEAD",
  "cli.github.com=GET,HEAD",
  "github.com=GET,HEAD",
  "github.com=POST=/*/*/git-upload-pack",
  "registry-1.docker.io=GET,HEAD",
  "auth.docker.io=GET,HEAD",
  "production.cloudfront.docker.com=GET,HEAD",
  "production.cloudflare.docker.com=GET,HEAD",
  "docs.docker.com=GET,HEAD",
]

# sbx's own default rules taken out: allows every sandbox had without Ogun asking. Other
# AI vendors (Claude's own domains come with each sandbox's kit), and three whole-host
# lists — every cloud's storage, every code and container host, every package registry —
# each of which a stranger's token or a pre-signed link can write to
# (docs/network.md#sbxs-default-rules). Debian/Ubuntu mirrors and certificate checks stay.
# An sbx upgrade may restore one, so every baseline, and every attach, takes it out again.
default_rules_off = [
  "default-ai-services",
  "default-cloud-infrastructure",
  "default-code-and-containers",
  "default-package-managers",
]
